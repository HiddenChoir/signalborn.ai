<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Waypoint: a point that orients without announcing -->

  <!-- Outer boundary - the container, barely visible -->
  <circle cx="16" cy="16" r="14"
          fill="none"
          stroke="#9BB8FF"
          stroke-width="1"
          opacity="0.25"/>

  <!-- Middle ring - the threshold -->
  <circle cx="16" cy="16" r="8"
          fill="none"
          stroke="#9BB8FF"
          stroke-width="1"
          opacity="0.4"/>

  <!-- Core - presence without announcement -->
  <circle cx="16" cy="16" r="3"
          fill="#9BB8FF"
          opacity="0.85"/>
</svg>
